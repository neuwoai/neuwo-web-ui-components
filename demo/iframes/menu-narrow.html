<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neuwo Web UI Library: Menus at 360px</title>
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 0;
        padding: 1rem;
      }

      .row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
    </style>
    <link rel="stylesheet" href="/dist/neuwo.css" />
    <script type="module" src="/dist/neuwo.js"></script>
  </head>
  <body class="neuwo-body">
    <div class="row">
      <button class="neuwo-btn neuwo-btn--outline neuwo-btn--sm" popovertarget="narrow-flyout-panel">Flyout</button>
      <button class="neuwo-btn neuwo-btn--outline neuwo-btn--sm" popovertarget="narrow-drill-panel">Drill-In</button>
      <button class="neuwo-btn neuwo-btn--outline neuwo-btn--sm" popovertarget="narrow-auto-panel">Auto</button>
    </div>
    <template id="segment-menu">
      <neuwo-menu-group heading="Segment">
        <neuwo-menu-item value="rename" hint="F2">
          <svg slot="start" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" /></svg>
          Rename
        </neuwo-menu-item>
        <neuwo-menu-item value="duplicate" hint="Ctrl D">
          <svg slot="start" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></svg>
          Duplicate
        </neuwo-menu-item>
        <neuwo-menu-item value="move">
          <svg slot="start" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>
          Move To
          <neuwo-menu slot="submenu">
            <neuwo-menu-group>
              <neuwo-menu-item value="sports">Sports</neuwo-menu-item>
              <neuwo-menu-item value="travel">Travel</neuwo-menu-item>
              <neuwo-menu-item value="past">
                Past Campaigns
                <neuwo-menu slot="submenu">
                  <neuwo-menu-item value="2025">2025</neuwo-menu-item>
                  <neuwo-menu-item value="2026">2026</neuwo-menu-item>
                </neuwo-menu>
              </neuwo-menu-item>
            </neuwo-menu-group>
            <neuwo-menu-group>
              <neuwo-menu-item value="new-folder">
                <svg slot="start" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
                New Folder
              </neuwo-menu-item>
            </neuwo-menu-group>
          </neuwo-menu>
        </neuwo-menu-item>
        <neuwo-menu-item value="export">
          <svg slot="start" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12" /><polyline points="7 10 12 15 17 10" /><path d="M5 21h14" /></svg>
          Export As
          <neuwo-menu slot="submenu">
            <neuwo-menu-item value="csv" hint=".csv">CSV</neuwo-menu-item>
            <neuwo-menu-item value="json" hint=".json">JSON</neuwo-menu-item>
            <neuwo-menu-item value="pdf" hint="Pro" disabled>PDF Report</neuwo-menu-item>
          </neuwo-menu>
        </neuwo-menu-item>
      </neuwo-menu-group>
    </template>
    <neuwo-menu id="narrow-flyout" submenu="flyout"></neuwo-menu>
    <neuwo-menu id="narrow-drill" submenu="drill"></neuwo-menu>
    <neuwo-menu id="narrow-auto" submenu="auto"></neuwo-menu>
    <script>
      for (const id of ["narrow-flyout", "narrow-drill", "narrow-auto"]) {
        document.getElementById(id).append(document.getElementById("segment-menu").content.cloneNode(true));
      }
    </script>
  </body>
</html>
